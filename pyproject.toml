[project]
name = "sbcli"
version = "0.1.0"
description = "Sports betting CLI calculator"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.0",
]

[project.scripts]
sbcli = "sbcli.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ['py38']
